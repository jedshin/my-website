<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aphirions | Next-Gen Embedded & Edge AI Solutions</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }
      body {
        background-color: #0d1117;
        color: #c9d1d9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 650px;
        text-align: center;
        background: #161b22;
        padding: 40px;
        border-radius: 12px;
        border: 1px solid #30363d;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }
      h1 {
        color: #58a6ff;
        font-size: 2.5rem;
        margin-bottom: 10px;
        letter-spacing: 1px;
      }
      .subtitle {
        font-size: 1.1rem;
        color: #8b949e;
        margin-bottom: 30px;
        line-height: 1.5;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin-bottom: 35px;
      }
      .tag {
        background-color: #21262d;
        color: #79c0ff;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
        border: 1px solid #30363d;
      }
      .notice {
        border-top: 1px solid #30363d;
        padding-top: 25px;
      }
      .notice h2 {
        color: #f0f6fc;
        font-size: 1.3rem;
        margin-bottom: 10px;
      }
      .notice p {
        color: #8b949e;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Aphirions</h1>
      <p class="subtitle">Innovative Embedded & Edge Intelligence Solutions</p>

      <div class="tags">
        <span class="tag">Embedded Software</span>
        <span class="tag">Embedded Hardware</span>
        <span class="tag">TinyML</span>
        <span class="tag">Small Machine Learning (SML)</span>
      </div>

      <div class="notice">
        <h2>Our Website is Under Construction</h2>
        <p>
          We are currently setting up our official platform. Our services and
          detailed offerings will be launched soon. Stay tuned!
        </p>
      </div>
    </div>
  </body>
</html>
